# Builds the image on every push to main (i.e. every merged pull request, and on demand from the Actions tab),
# pushes it to this Gitea's container registry, then restarts the deployed copy on the server with it.
#
# Runs on the server's own act_runner (runner/ in this repo, label claude-code-runner:host): jobs run inside that
# container, which drives the host's Docker and has APP_DIR (the deployed compose project) mounted.
# APP_DIR's docker-compose.yml must use image ${REGISTRY}/${repository}:latest.
#
# Because .gitea/workflows exists, Gitea ignores the upstream .github/workflows (Docker Hub publishing).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COMPOSE_PROGRESS: quiet

jobs:
  deploy:
    runs-on: claude-code-runner
    env:
      # Override with a repository variable named APP_DIR if the deployment lives elsewhere.
      APP_DIR: ${{ vars.APP_DIR || '/srv/claude-code-runner' }}
    steps:
      - name: Check out this commit
        # Plain git with the job token, since the runner has no Node for actions/checkout. Host-mode workspaces
        # persist between runs, so leftovers are cleaned.
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" \
            fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.ref }}"
          git checkout -q -f --detach "${{ gitea.sha }}"
          git clean -fdxq
          git log -1 --oneline

      - name: Build image
        run: |
          registry="${{ gitea.server_url }}"; registry="${registry#*://}"
          image="$registry/$(echo '${{ gitea.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          # Pass the current Claude Code release so its layer rebuilds when a new one ships (a cached layer would pin an
          # old CLI and miss new models), while the apt/npm layers above it stay cached.
          claude_code=$(curl -fsS https://registry.npmjs.org/@anthropic-ai/claude-code/latest | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$claude_code" ] || { echo "::error::Could not look up the latest Claude Code version"; exit 1; }
          echo "Claude Code $claude_code"
          # Quiet on success. On failure, quiet mode hides the failing step's output, so rebuild with full output
          # (cached layers make that fast up to the failing step).
          set -- --build-arg CLAUDE_CODE_VERSION="$claude_code" -t "$image:${{ gitea.sha }}" -t "$image:latest" .
          docker build --pull --progress=quiet "$@" || docker build --progress=plain "$@"

      - name: Push to the Gitea registry
        # The job token can't push packages on this Gitea, so this needs a repo secret REGISTRY_TOKEN:
        # a token with write:package, owned by the user the image lives under.
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          [ -n "$REGISTRY_TOKEN" ] || { echo "::error::Add a repo secret REGISTRY_TOKEN (a Gitea token with write:package)"; exit 1; }
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u '${{ gitea.repository_owner }}' --password-stdin
          docker push -q "$IMAGE:${{ gitea.sha }}"
          docker push -q "$IMAGE:latest"

      - name: Deploy
        run: |
          cd "$APP_DIR"
          docker compose pull -q
          docker compose up -d --quiet-pull
          docker image prune -f >/dev/null

      - name: Check it's serving
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:7334/health && exit 0
            sleep 2
          done
          echo "::error::Not healthy after 60s"; docker logs --tail 50 claude-code-runner; exit 1
