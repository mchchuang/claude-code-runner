<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --sunken: #eef0f3;
      --line: #e1e4e9;
      --ink: #15171c;
      --muted: #687082;
      --accent: #3b5bdb;
      --accent-soft: #e8edfd;
      --ok: #1f8a4c;
      --ok-soft: #e4f4ea;
      --fail: #cf3a3a;
      --fail-soft: #fbe9e9;
      --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f12;
        --surface: #16181c;
        --sunken: #1d2025;
        --line: #272a31;
        --ink: #e9eaee;
        --muted: #8e93a0;
        --accent: #8b9df7;
        --accent-soft: #1f2540;
        --ok: #4cc983;
        --ok-soft: #15291e;
        --fail: #f07a7a;
        --fail-soft: #331a1c;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 14px/1.5 var(--sans);
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input, textarea { font: inherit; color: inherit; }
    code, .mono { font-family: var(--mono); font-size: 12.5px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--surface); cursor: pointer; white-space: nowrap;
      text-decoration: none; font-weight: 500;
    }
    .btn:hover { background: var(--sunken); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn.primary:hover { opacity: .88; }
    .btn.quiet { border-color: transparent; background: none; color: var(--muted); }
    .btn.quiet:hover { color: var(--ink); background: var(--sunken); }
    .btn.danger { color: var(--fail); }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      height: 52px; padding: 0 16px;
      border-bottom: 1px solid var(--line); background: var(--surface);
      flex-shrink: 0;
    }
    .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
    .counts { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
    .counts .running { color: var(--accent); font-weight: 500; }
    .topbar .spacer { flex: 1; }
    .who { color: var(--muted); font-size: 13px; }

    /* ---------- Split layout ---------- */
    .split { flex: 1; display: grid; grid-template-columns: minmax(320px, 400px) 1fr; min-height: 0; }
    .split > * { min-width: 0; } /* long commands must truncate, not widen the page */
    .side { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); min-height: 0; }

    .composer { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
    .repo-row { display: flex; gap: 6px; }
    /* Repo picker: a combobox, type to filter or open the list to pick */
    .combo { position: relative; flex: 1; min-width: 0; }
    .combo .field { padding-right: 34px; }
    .combo-toggle {
      position: absolute; top: 1px; right: 1px; width: 32px; height: 32px;
      display: grid; place-items: center; border: 0; border-radius: 0 6px 6px 0;
      background: none; color: var(--muted); cursor: pointer;
    }
    .combo-toggle:hover { color: var(--ink); }
    .combo-toggle svg { transition: transform .15s; }
    .combo.open .combo-toggle svg { transform: rotate(180deg); }
    .combo-list {
      position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0;
      max-height: min(320px, 50vh); overflow-y: auto; overscroll-behavior: contain;
      list-style: none; padding: 4px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
      box-shadow: 0 8px 24px rgb(0 0 0 / .14);
    }
    .combo-list[hidden] { display: none; }
    .combo-list [role="option"] {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: center;
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }
    .combo-list [role="option"]:hover, .combo-list [role="option"].active { background: var(--sunken); }
    .combo-list [aria-selected="true"] .opt-name { color: var(--accent); }
    .combo-list [aria-selected="true"] .opt-name::after { content: ' \2713'; }
    .combo-list mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
    .opt-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt-tags { display: flex; gap: 4px; }
    .opt-tag { padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; line-height: 16px; }
    .opt-desc { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt-empty { padding: 8px 10px; color: var(--muted); }
    .field {
      width: 100%; height: 34px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    }
    .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea.field { height: auto; min-height: 96px; padding: 9px 10px; resize: vertical; line-height: 1.5; }
    .composer-box { position: relative; }
    .composer-box textarea.field { padding-bottom: 44px; display: block; }
    .composer-box .model-select {
      position: absolute; left: 8px; bottom: 8px; height: 28px; width: auto; max-width: 55%;
      padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer;
    }
    .composer-box .model-select:hover { background: var(--sunken); }
    .composer-box .send {
      position: absolute; right: 8px; bottom: 8px; width: 30px; height: 28px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .composer-foot { display: flex; align-items: center; gap: 10px; }
    .hint { color: var(--muted); font-size: 12.5px; flex: 1; min-width: 0; }
    .hint.error { color: var(--fail); }
    .hint a { color: var(--muted); }

    .list { flex: 1; overflow-y: auto; }
    .task {
      display: grid; grid-template-columns: 14px 1fr; gap: 2px 10px;
      width: 100%; padding: 12px 16px; text-align: left;
      border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer;
    }
    .task:hover { background: var(--sunken); }
    .task[aria-current="true"] { background: var(--accent-soft); }
    .task-row { position: relative; }
    .task-row .task { padding-right: 44px; }
    .task-row.archived .task-title, .task-row.archived .dot { opacity: .6; }
    .more {
      width: 28px; height: 28px; padding: 0; justify-content: center;
      font-size: 16px; line-height: 1; letter-spacing: 1px;
    }
    .task-row .more { position: absolute; top: 8px; right: 10px; }
    .more[aria-expanded="true"] { color: var(--ink); background: var(--sunken); }
    .list-foot { padding: 10px 16px; display: flex; justify-content: center; }

    /* ---------- Task actions menu ---------- */
    .menu {
      position: fixed; z-index: 10; min-width: 160px; padding: 4px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
      box-shadow: 0 8px 24px rgb(0 0 0 / .14);
    }
    .menu[hidden] { display: none; }
    .menu button {
      display: block; width: 100%; padding: 7px 10px; text-align: left;
      border: 0; border-radius: 6px; background: none; cursor: pointer;
    }
    .menu button:hover, .menu button:focus-visible { background: var(--sunken); outline: none; }
    .menu button.danger { color: var(--fail); }
    .task .dot { margin-top: 6px; }
    .task-title { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .task-sub { grid-column: 2; display: flex; gap: 10px; color: var(--muted); font-size: 12.5px; }
    .task-sub .repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-sub .when { margin-left: auto; flex-shrink: 0; }
    .empty { padding: 32px 16px; color: var(--muted); text-align: center; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.running { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dot.completed { background: var(--ok); }
    .dot.failed { background: var(--fail); }

    /* ---------- Detail ---------- */
    .detail { overflow-y: auto; min-height: 0; }
    .detail-inner { max-width: 820px; margin: 0 auto; padding: 28px 32px 64px; }
    .placeholder { height: 100%; display: grid; place-items: center; color: var(--muted); padding: 32px; text-align: center; }
    .back { display: none; margin-bottom: 16px; }

    .status {
      display: inline-flex; align-items: center; gap: 6px;
      height: 24px; padding: 0 9px; border-radius: 999px;
      font-size: 12.5px; font-weight: 500;
      background: var(--sunken); color: var(--muted);
    }
    .status.running { background: var(--accent-soft); color: var(--accent); }
    .status.completed { background: var(--ok-soft); color: var(--ok); }
    .status.failed { background: var(--fail-soft); color: var(--fail); }
    .status .dot { background: currentColor; box-shadow: none; }

    .detail h1 { font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -0.015em; margin: 14px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prompt-more { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 4px; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; margin: 14px 0 0; }
    .facts dt { display: inline; }
    .facts dd { display: inline; color: var(--ink); margin-left: 6px; }
    /* #detail-head generates no box, so the sticky .detail-top (status, PR button, title, repo,
       branch and timing) is bounded by .detail-inner and stays pinned while the timeline scrolls.
       A long prompt scrolls inside its own box so the pinned part stays short. */
    #detail-head { display: contents; }
    .detail-top {
      position: sticky; top: 0; z-index: 2;
      margin: 0 -8px; padding: 8px 8px 12px; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .detail-top .prompt-more { max-height: 7.5em; overflow-y: auto; }
    .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .head-row .push { margin-left: auto; }
    .archived-tag { color: var(--muted); font-size: 12.5px; }
    .problem { margin-top: 18px; padding: 12px 14px; border-radius: 8px; background: var(--fail-soft); color: var(--fail); }
    .problem p + p { margin-top: 4px; color: var(--ink); opacity: .8; }

    /* ---------- Run timeline ---------- */
    .phase { margin-top: 32px; }
    .phase-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 10px; }
    .phase-head h2 { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .phase-head .what { color: var(--muted); font-size: 13px; }
    .phase-head .state { margin-left: auto; font-size: 12.5px; color: var(--muted); }
    .phase-head .state.ok { color: var(--ok); }
    .phase-head .state.fail { color: var(--fail); }

    .steps { list-style: none; position: relative; margin-left: 4px; padding-left: 22px; border-left: 1px solid var(--line); }
    .step { position: relative; padding: 5px 0; }
    .step::before {
      content: ''; position: absolute; left: -26px; top: 13px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--muted);
    }
    .step.say::before { background: var(--muted); border-color: var(--muted); }
    .step.bad::before { border-color: var(--fail); background: var(--fail); }
    .step.live::before { border-color: var(--accent); background: var(--accent); animation: pulse 1.6s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-soft); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    @media (prefers-reduced-motion: reduce) { .step.live::before { animation: none; } }

    .say-text { overflow-wrap: anywhere; max-width: 72ch; }

    /* Markdown from Claude's messages and results */
    .md > * + * { margin-top: 8px; }
    .md h3, .md h4, .md h5, .md h6 { font-size: 14px; font-weight: 600; }
    .md h3 { font-size: 15.5px; }
    .md * + h3, .md * + h4, .md * + h5, .md * + h6 { margin-top: 14px; }
    .md ul, .md ol { padding-left: 22px; }
    .md li + li, .md li > * + * { margin-top: 3px; }
    .md li:has(> input[type=checkbox]) { list-style: none; margin-left: -20px; }
    .md li > input[type=checkbox] { margin: 0 6px 0 0; vertical-align: -1px; }
    .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md code { padding: 1px 5px; border-radius: 4px; background: var(--sunken); }
    .md pre { padding: 10px 12px; border-radius: 7px; background: var(--sunken); overflow: auto; font: 12px/1.55 var(--mono); }
    .md pre code { padding: 0; background: none; font: inherit; white-space: pre; }
    .md blockquote { padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
    .md hr { border: 0; border-top: 1px solid var(--line); }
    .md .table-wrap { overflow-x: auto; }
    .md table { border-collapse: collapse; font-size: 13px; }
    .md th, .md td { padding: 4px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .md th { background: var(--sunken); font-weight: 600; }
    .note { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

    details.tool > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 2px 6px; margin: 0 -6px; border-radius: 6px; }
    details.tool > summary::-webkit-details-marker { display: none; }
    details.tool > summary:hover { background: var(--sunken); }
    details.tool:not(.has-output) > summary { cursor: default; }
    details.tool:not(.has-output) > summary:hover { background: none; }
    .tool-name { font-weight: 600; font-size: 13px; }
    .tool-what { overflow-wrap: anywhere; }
    .tool-cmd { grid-column: 2; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details[open] .tool-cmd { white-space: pre-wrap; overflow-wrap: anywhere; }
    .tool-out {
      margin: 6px 0 4px; padding: 10px 12px; border-radius: 7px;
      background: var(--sunken); max-height: 360px; overflow: auto;
      white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono);
    }
    .tool-out.bad { color: var(--fail); }

    .outcome { margin-top: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .outcome.bad { border-color: var(--fail); }
    .outcome-text { overflow-wrap: anywhere; max-width: 72ch; }
    .outcome-meta { display: flex; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 12.5px; }

    /* ---------- Settings dialog ---------- */
    dialog {
      margin: auto; width: min(480px, calc(100vw - 32px));
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); color: var(--ink); padding: 0;
    }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    .dlg-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { font-size: 15px; font-weight: 600; flex: 1; }
    .dlg-body { padding: 20px; display: grid; gap: 14px; }
    .dlg-body p { color: var(--muted); }
    .token-state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .new-token { padding: 12px; border-radius: 8px; background: var(--ok-soft); display: grid; gap: 8px; }
    .new-token p { color: var(--ok); font-weight: 500; }
    .new-token code { overflow-wrap: anywhere; }
    label.stack { display: grid; gap: 6px; font-weight: 500; }
    label.stack small { color: var(--muted); font-weight: 400; }

    /* ---------- Narrow screens: list, then full-screen task ---------- */
    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; }
      .detail { display: none; }
      body.show-detail .side { display: none; }
      body.show-detail .detail { display: block; }
      .detail-inner { padding: 16px 16px 48px; }
      .back { display: inline-flex; }
      .counts, .who { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">Claude Runner</span>
    <div class="counts" id="counts"></div>
    <span class="spacer"></span>
    <span class="who" id="username"></span>
    <button class="btn quiet" onclick="openSettings()">API access</button>
    <button class="btn quiet" onclick="logout()">Sign out</button>
  </header>

  <div class="split">
    <aside class="side">
      <form class="composer" id="composer" onsubmit="submitTask(event)">
        <div class="repo-row" id="repo-row" hidden>
          <div class="combo" id="repo-combo">
            <input class="field" id="repo" role="combobox" aria-autocomplete="list" aria-expanded="false"
              aria-controls="repo-options" autocomplete="off" spellcheck="false"
              placeholder="Any repo (Claude picks from your prompt)" aria-label="Repository"
              oninput="onRepoTyped()" onkeydown="onRepoKey(event)" onclick="openRepoList()" onblur="closeRepoList()">
            <button type="button" class="combo-toggle" id="repo-toggle" tabindex="-1" aria-label="Show repos"
              onmousedown="event.preventDefault()" onclick="toggleRepoList()">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="combo-list" id="repo-options" role="listbox" aria-label="Repositories" hidden
              onmousedown="event.preventDefault()" onclick="onRepoOptionClick(event)"></ul>
          </div>
          <button type="button" class="btn quiet" onclick="fetchRepos(true)" title="Reload repos" aria-label="Reload repos">&#x21bb;</button>
        </div>
        <div class="composer-box">
          <textarea class="field" id="prompt" placeholder="Describe the change you want" aria-label="Task"></textarea>
          <select class="model-select" id="model" aria-label="Model" title="Model">
            <option value="">Default model</option>
            <option value="opus">Opus</option>
            <option value="sonnet">Sonnet</option>
            <option value="haiku">Haiku</option>
          </select>
          <button class="btn primary send" id="submit-btn" type="submit" title="Run task (Ctrl+Enter)" aria-label="Run task">&#x21b5;</button>
        </div>
        <div class="composer-foot">
          <span class="hint" id="repo-hint"></span>
        </div>
      </form>
      <nav class="list" id="tasks" aria-label="Tasks"></nav>
    </aside>

    <main class="detail" id="detail">
      <div class="placeholder" id="placeholder">Pick a task to follow what Claude is doing.</div>
    </main>
  </div>

  <div class="menu" id="task-menu" role="menu" hidden></div>

  <dialog id="settings">
    <div class="dlg-head">
      <h2>API access</h2>
      <button class="btn quiet" onclick="settings.close()" aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
      <p>Scripts and integrations call this runner with an API token. Only one token exists at a time.</p>
      <div class="token-state">
        <span id="token-status">Checking…</span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn danger" id="revoke-btn" onclick="revokeToken()" hidden>Revoke</button>
        <button class="btn" onclick="generateToken()">Generate token</button>
      </div>
      <div class="new-token" id="new-token" hidden>
        <p>Copy this token now. It won't be shown again.</p>
        <code id="new-token-value"></code>
        <div><button class="btn" id="copy-btn" onclick="copyToken()">Copy token</button></div>
      </div>
      <label class="stack">
        Token for this browser
        <input class="field" type="password" id="api-token" placeholder="Paste a token" autocomplete="off">
        <small>Sent with this dashboard's requests. Stored in this browser only.</small>
      </label>
    </div>
  </dialog>

  <script>
    const $ = id => document.getElementById(id);
    const settings = $('settings');
    let tasks = [];
    let repos = [];
    let reposEnabled = false;
    let selectedId = null;
    let showArchived = false;
    let menuTaskId = null;
    let logTimer = null;
    let lastLogText = '';

    const store = {
      get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
      set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
    };

    function esc(v) {
      return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    const safeUrl = u => /^https?:\/\//.test(u || '') ? u : null;

    // Minimal Markdown renderer for Claude's text: everything is escaped first, so the only HTML out is ours.
    // Covers what Claude writes: headings, emphasis, inline and fenced code, links, lists (nested, task
    // checkboxes), blockquotes, tables and rules. Single newlines are kept as line breaks.
    function mdInline(s) {
      const keep = [];
      const hold = html => `\u0000${keep.push(html) - 1}\u0000`;
      let h = esc(String(s ?? '').replace(/\u0000/g, ''))
        .replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${c}</code>`))
        .replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
          const href = safeUrl(u.replace(/&amp;/g, '&'));
          return href ? hold(`<a href="${esc(href)}" target="_blank" rel="noopener">${t}</a>`) : m;
        })
        .replace(/\bhttps?:\/\/(?:(?!&quot;|&lt;|&gt;)[^\s<])+/g, raw => {
          // Leave trailing punctuation (and Markdown markers) outside the link
          const u = raw.match(/^.*?(?=[.,;:!?)\]'*_~]*$)/)[0];
          const href = u.replace(/&amp;/g, '&');
          return hold(`<a href="${esc(href)}" target="_blank" rel="noopener">${u}</a>`) + raw.slice(u.length);
        })
        .replace(/\*\*(?=\S)(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^\w])__(?=\S)(.+?)__(?!\w)/g, '$1<strong>$2</strong>')
        .replace(/(^|[^*\w])\*(?=[^\s*])(.+?)\*(?![*\w])/g, '$1<em>$2</em>')
        .replace(/(^|[^\w])_(?=[^\s_])(.+?)_(?!\w)/g, '$1<em>$2</em>')
        .replace(/~~(?=\S)(.+?)~~/g, '<del>$1</del>')
        .replace(/\n/g, '<br>');
      while (h.includes('\u0000')) h = h.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
      return h;
    }

    const MD_LIST = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
    const MD_RULE = /^\s*([-*_])(\s*\1){2,}\s*$/;
    const MD_TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
    const mdCells = l => l.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
    const mdIndent = l => l.match(/^\s*/)[0].length;
    const mdTableAt = (lines, i) => lines[i].includes('|') && MD_TABLE_SEP.test(lines[i + 1] || '') && lines[i + 1].includes('-');
    const mdBlockStart = (lines, i) => /^\s*(```|~~~|#{1,6}\s|>)/.test(lines[i]) || MD_LIST.test(lines[i])
      || MD_RULE.test(lines[i]) || mdTableAt(lines, i);

    function md(src) {
      const lines = String(src ?? '').replace(/\r\n?/g, '\n').split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        let m;
        if (!line.trim()) { i++; continue; }
        if ((m = line.match(/^\s*(```|~~~)\s*([\w+#.-]*)/))) {
          const buf = [];
          for (i++; i < lines.length && !lines[i].trim().startsWith(m[1]); i++) buf.push(lines[i]);
          i++;
          out.push(`<pre><code${m[2] ? ` class="lang-${esc(m[2])}"` : ''}>${esc(buf.join('\n'))}</code></pre>`);
        } else if ((m = line.match(/^\s*(#{1,6})\s+(.*?)(\s+#+)?\s*$/))) {
          // Phases are <h2>, so Markdown headings start at <h3>
          const n = Math.min(m[1].length + 2, 6);
          out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);
          i++;
        } else if (MD_RULE.test(line)) {
          out.push('<hr>');
          i++;
        } else if (/^\s*>/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*> ?/, ''));
          out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`);
        } else if (mdTableAt(lines, i)) {
          const head = mdCells(line);
          const align = mdCells(lines[i + 1]).map(c => c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right') : '');
          const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${mdInline(c)}</${tag}>`;
          const rows = [];
          for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|'); i++) rows.push(mdCells(lines[i]));
          out.push(`<div class="table-wrap"><table><thead><tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr></thead>`
            + `<tbody>${rows.map(r => `<tr>${head.map((_, k) => cell('td', r[k] ?? '', k)).join('')}</tr>`).join('')}</tbody></table></div>`);
        } else if ((m = line.match(MD_LIST))) {
          const indent = m[1].length;
          const ordered = /\d/.test(m[2]);
          const sameList = lm => lm && lm[1].length === indent && /\d/.test(lm[2]) === ordered;
          const items = [];
          while (i < lines.length) {
            const l = lines[i];
            const lm = l.match(MD_LIST);
            const it = items[items.length - 1];
            if (sameList(lm)) { items.push({ head: [lm[3]], body: [] }); i++; continue; }
            if (!l.trim()) {
              let k = i;
              while (k < lines.length && !lines[k].trim()) k++;
              if (k < lines.length && (mdIndent(lines[k]) > indent || sameList(lines[k].match(MD_LIST)))) { it.body.push(''); i = k; continue; }
              break;
            }
            if (mdIndent(l) > indent) {
              (it.body.length || mdBlockStart(lines, i) ? it.body : it.head).push(it.body.length || mdBlockStart(lines, i) ? l : l.trim());
              i++;
              continue;
            }
            if (!it.body.length && !mdBlockStart(lines, i)) { it.head.push(l.trim()); i++; continue; }
            break;
          }
          const tag = ordered ? 'ol' : 'ul';
          const start = ordered ? parseInt(m[2], 10) : 1;
          out.push(`<${tag}${start !== 1 ? ` start="${start}"` : ''}>${items.map(it => {
            let head = it.head.join('\n');
            let box = '';
            const t = head.match(/^\[([ xX])\]\s+/);
            if (t) { box = `<input type="checkbox" disabled${t[1] === ' ' ? '' : ' checked'}> `; head = head.slice(t[0].length); }
            const body = it.body.filter(l => l.trim());
            const cut = body.length ? Math.min(...body.map(mdIndent)) : 0;
            return `<li>${box}${mdInline(head)}${body.length ? md(it.body.map(l => l.slice(cut)).join('\n')) : ''}</li>`;
          }).join('')}</${tag}>`);
        } else {
          const buf = [line.trim()];
          for (i++; i < lines.length && lines[i].trim() && !mdBlockStart(lines, i); i++) buf.push(lines[i].trim());
          out.push(`<p>${mdInline(buf.join('\n'))}</p>`);
        }
      }
      return out.join('');
    }

    function ago(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }
    function span(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
    }

    function authHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      const token = $('api-token').value;
      if (token) headers.Authorization = 'Bearer ' + token;
      return headers;
    }
    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: authHeaders() });
      if (res.status === 401) { location.href = '/login'; throw new Error('Signed out'); }
      return res;
    }

    // ============ Tasks ============

    const STATUS_LABEL = { running: 'Running', queued: 'Queued', completed: 'Done', failed: 'Failed' };

    async function fetchTasks() {
      try {
        tasks = await (await api('/tasks')).json();
      } catch (e) {
        return console.error('Failed to load tasks:', e);
      }
      renderCounts();
      renderList();
      if (selectedId) renderHeader();
    }

    function renderCounts() {
      const n = s => tasks.filter(t => !t.archived && s.includes(t.status)).length;
      const running = n(['running', 'queued']);
      $('counts').innerHTML =
        (running ? `<span class="running">${running} running</span>` : '') +
        `<span>${n(['completed'])} done</span>` +
        (n(['failed']) ? `<span>${n(['failed'])} failed</span>` : '');
    }

    function moreButton(t) {
      return `<button class="btn quiet more" data-id="${esc(t.id)}" onclick="openTaskMenu(event, '${esc(t.id)}')" aria-haspopup="menu"
          aria-expanded="${t.id === menuTaskId}" aria-label="Actions for this task" title="Archive or delete">&hellip;</button>`;
    }

    function renderList() {
      if (!tasks.length) {
        $('tasks').innerHTML = '<p class="empty">No tasks yet. Describe a change above to start one.</p>';
        return;
      }
      const archived = tasks.filter(t => t.archived).length;
      const shown = showArchived ? tasks : tasks.filter(t => !t.archived);
      $('tasks').innerHTML = (shown.length ? shown.map(t => `
        <div class="task-row${t.archived ? ' archived' : ''}">
          <button class="task" onclick="selectTask('${esc(t.id)}')" aria-current="${t.id === selectedId}">
            <span class="dot ${esc(t.status)}" title="${esc(STATUS_LABEL[t.status] || t.status)}"></span>
            <span class="task-title">${esc(t.prompt.split('\n')[0])}</span>
            <span class="task-sub">
              <span class="repo">${esc(t.repo || 'Repo not picked yet')}</span>
              ${t.pr_url ? '<span>PR open</span>' : ''}
              ${t.archived ? '<span>Archived</span>' : ''}
              <span class="when">${ago(t.started)}</span>
            </span>
          </button>
          ${moreButton(t)}
        </div>`).join('') : '<p class="empty">No active tasks.</p>') +
        (archived ? `<div class="list-foot"><button class="btn quiet" id="toggle-archived" onclick="toggleArchived()">${
          showArchived ? 'Hide archived' : `Show archived (${archived})`}</button></div>` : '');
    }

    function toggleArchived() {
      showArchived = !showArchived;
      renderList();
    }

    // ============ Task actions (archive, delete) ============

    function openTaskMenu(e, id) {
      e.stopPropagation();
      if (menuTaskId === id) return closeTaskMenu();
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      closeTaskMenu();
      menuTaskId = id;
      const menu = $('task-menu');
      menu.innerHTML = `
        <button role="menuitem" data-action="archive" onclick="setArchived('${esc(id)}', ${!t.archived})">${t.archived ? 'Unarchive' : 'Archive'}</button>
        <button role="menuitem" data-action="delete" class="danger" onclick="deleteTask('${esc(id)}')">Delete&hellip;</button>`;
      menu.hidden = false;
      // Below the button, right-aligned to it, flipped up if it would run off the bottom
      const r = e.currentTarget.getBoundingClientRect();
      const h = menu.offsetHeight || 80;
      const w = menu.offsetWidth || 160;
      menu.style.left = Math.max(8, r.right - w) + 'px';
      menu.style.top = (r.bottom + 4 + h > window.innerHeight ? Math.max(8, r.top - 4 - h) : r.bottom + 4) + 'px';
      e.currentTarget.setAttribute('aria-expanded', 'true');
      menu.querySelector('button').focus();
    }

    function closeTaskMenu() {
      if (!menuTaskId) return;
      menuTaskId = null;
      $('task-menu').hidden = true;
      document.querySelectorAll('.more[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
    }

    document.addEventListener('click', e => { if (!$('task-menu').contains(e.target)) closeTaskMenu(); });
    window.addEventListener('resize', closeTaskMenu);
    document.addEventListener('scroll', closeTaskMenu, true);

    async function setArchived(id, archived) {
      closeTaskMenu();
      try {
        const res = await api('/task/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ archived }) });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'HTTP ' + res.status);
        const t = tasks.find(t => t.id === id);
        if (t) t.archived = archived;
        renderCounts();
        renderList();
        if (id === selectedId) renderHeader();
      } catch (e) {
        alert(`Couldn't ${archived ? 'archive' : 'unarchive'} the task: ${e.message}`);
      }
    }

    async function deleteTask(id) {
      closeTaskMenu();
      const t = tasks.find(t => t.id === id);
      const running = t && (t.status === 'running' || t.status === 'queued');
      if (!confirm(running
        ? 'Delete this task? It is still running: Claude will be stopped, and its log will be deleted.'
        : 'Delete this task and its log? This can\'t be undone. Its branch and pull request are kept.')) return;
      try {
        const res = await api('/task/' + encodeURIComponent(id), { method: 'DELETE' });
        if (!res.ok && res.status !== 404) throw new Error((await res.json().catch(() => ({}))).error || 'HTTP ' + res.status);
        tasks = tasks.filter(t => t.id !== id);
        if (id === selectedId) closeTask();
        renderCounts();
        renderList();
      } catch (e) {
        alert('Couldn\'t delete the task: ' + e.message);
      }
    }

    function selectTask(id) {
      selectedId = id;
      if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
      document.body.classList.add('show-detail');
      lastLogText = '';
      $('detail').innerHTML = `<div class="detail-inner">
          <button class="btn quiet back" onclick="closeTask()">&larr; All tasks</button>
          <div id="detail-head"></div>
          <div id="timeline"><p class="note" style="margin-top:32px">Loading run…</p></div>
        </div>`;
      renderList();
      renderHeader();
      fetchLogs(true);
      clearInterval(logTimer);
      logTimer = setInterval(() => fetchLogs(false), 2000);
    }

    function closeTask() {
      selectedId = null;
      clearInterval(logTimer);
      history.replaceState(null, '', location.pathname);
      document.body.classList.remove('show-detail');
      $('detail').innerHTML = '<div class="placeholder">Pick a task to follow what Claude is doing.</div>';
      renderList();
    }

    const ERROR_HELP = {
      auth_expired: 'Claude\'s login on the server has expired. Log in again on the server, then rerun the task.',
      capacity_reached: 'Claude hit its usage limit. Try again later.',
      timeout: 'The task ran longer than 1 hour and was stopped.',
      exit_code: 'Claude stopped with an error. The run below shows the last steps.',
      interrupted: 'The runner restarted (for example a redeploy) while this task was running, so it was stopped. Check its branch for pushed work, or rerun it.'
    };

    function renderHeader() {
      const t = tasks.find(t => t.id === selectedId);
      const head = $('detail-head');
      if (!head) return;
      if (!t) { head.innerHTML = '<p class="note">This task no longer exists. Tasks are cleared when the runner restarts.</p>'; return; }

      const [first, ...rest] = t.prompt.split('\n');
      const pr = safeUrl(t.pr_url);
      const repoUrl = safeUrl(t.repo_url);
      const ended = t.finished ? new Date(t.finished) : new Date();
      head.innerHTML = `
        <div class="detail-top">
        <div class="head-row">
          <span class="status ${esc(t.status)}"><span class="dot"></span>${esc(STATUS_LABEL[t.status] || t.status)}</span>
          ${t.archived ? '<span class="archived-tag">Archived</span>' : ''}
          <span class="push"></span>
          ${pr ? `<a class="btn primary" href="${esc(pr)}" target="_blank" rel="noopener">Open pull request</a>` : ''}
          ${moreButton(t)}
        </div>
        <h1>${esc(first)}</h1>
        ${rest.join('\n').trim() ? `<p class="prompt-more">${esc(rest.join('\n').trim())}</p>` : ''}
        <dl class="facts">
          <div><dt>Repo</dt><dd>${t.repo ? (repoUrl ? `<a href="${esc(repoUrl)}" target="_blank" rel="noopener">${esc(t.repo)}</a>` : esc(t.repo)) : 'Picked from prompt'}</dd></div>
          <div><dt>Branch</dt><dd><code>claude/${esc(t.id)}</code></dd></div>
          <div><dt>Started</dt><dd title="${esc(new Date(t.started).toLocaleString())}">${ago(t.started)}</dd></div>
          <div><dt>${t.finished ? 'Took' : 'Running for'}</dt><dd>${span(ended - new Date(t.started))}</dd></div>
        </dl>
        </div>
        ${t.status === 'failed' ? `<div class="problem">
          <p>${esc(ERROR_HELP[t.errorType] || 'The task failed.')}</p>
          ${t.error ? `<p>${esc(t.error)}</p>` : ''}
        </div>` : ''}`;
    }

    // ============ Run timeline (parsed from the stream-json log) ============

    const PHASES = {
      ORCHESTRATOR: { title: 'Set up', what: 'Find the repo, clone it, install tools, create the branch' },
      WORKER: { title: 'Work', what: 'Make the change, commit, push and open a pull request' }
    };

    function toolSummary(b) {
      const i = b.input || {};
      const path = i.file_path || i.path || i.notebook_path;
      // Search tools: what was searched for matters more than where
      if (i.pattern) return { what: i.pattern, cmd: i.path || i.glob || '' };
      return {
        what: i.description || (path ? path.split('/').slice(-2).join('/') : '') || i.url || i.query || i.subagent_type || '',
        cmd: i.command || (i.description && path) || ''
      };
    }

    function resultText(c) {
      if (Array.isArray(c)) return c.map(x => x.text ?? (x.type === 'image' ? '[image]' : '')).join('\n');
      return String(c ?? '');
    }

    function parseLog(text) {
      const phases = [];
      const tools = {};
      let cur = null;
      for (const raw of text.split('\n')) {
        const line = raw.trim();
        if (!line) continue;
        let m;
        if ((m = line.match(/^=== (\w+) PHASE ===$/))) { cur = { key: m[1], items: [], done: false }; phases.push(cur); continue; }
        if ((m = line.match(/^=== (\w+) COMPLETE ===$/))) { const p = phases.find(p => p.key === m[1]); if (p) p.done = true; continue; }
        if (!cur) continue; // task header (ID / Repo / Prompt) is already shown above the timeline
        if (line[0] !== '{') { cur.items.push({ kind: 'note', text: line }); continue; }
        let d;
        try { d = JSON.parse(line); } catch { cur.items.push({ kind: 'note', text: line }); continue; }

        if (d.type === 'system' && d.subtype === 'init') cur.model = d.model;
        else if (d.type === 'assistant') {
          for (const b of d.message?.content || []) {
            if (b.type === 'text' && b.text.trim()) cur.items.push({ kind: 'say', text: b.text.trim() });
            else if (b.type === 'tool_use') { tools[b.id] = { kind: 'tool', id: b.id, name: b.name, ...toolSummary(b), out: null, bad: false }; cur.items.push(tools[b.id]); }
          }
        } else if (d.type === 'user') {
          for (const b of d.message?.content || []) {
            const t = b.type === 'tool_result' && tools[b.tool_use_id];
            if (t) { t.out = resultText(b.content); t.bad = !!b.is_error; }
          }
        } else if (d.type === 'result') {
          cur.result = { bad: !!d.is_error || String(d.subtype || '').startsWith('error'), text: d.result || '', ms: d.duration_ms, cost: d.total_cost_usd };
        }
      }
      return phases;
    }

    function renderTimeline(phases, task) {
      if (!phases.length) return '<p class="note" style="margin-top:32px">Waiting for Claude to start…</p>';
      const live = task?.status === 'running';
      return phases.map((p, pi) => {
        const info = PHASES[p.key] || { title: p.key.toLowerCase(), what: '' };
        const isLast = pi === phases.length - 1;
        const failed = p.result?.bad || (!p.done && !live && task?.status === 'failed' && isLast);
        const state = p.done || (p.result && !p.result.bad) ? '<span class="state ok">Finished</span>'
          : failed ? '<span class="state fail">Failed</span>'
          : live && isLast ? '<span class="state">In progress</span>' : '';
        const steps = p.items.map((it, ii) => {
          const liveCls = live && isLast && !p.result && ii === p.items.length - 1 ? ' live' : '';
          if (it.kind === 'say') return `<li class="step say${liveCls}"><div class="say-text md">${md(it.text)}</div></li>`;
          if (it.kind === 'note') return `<li class="step${liveCls}"><p class="note">${esc(it.text)}</p></li>`;
          const hasOut = it.out !== null && it.out.trim() !== '';
          return `<li class="step${it.bad ? ' bad' : ''}${liveCls}">
            <details class="tool${hasOut ? ' has-output' : ''}" data-id="${esc(it.id)}">
              <summary${hasOut ? '' : ' tabindex="-1"'}>
                <span class="tool-name">${esc(it.name)}</span>
                <span class="tool-what">${esc(it.what)}</span>
                ${it.cmd ? `<code class="tool-cmd">${esc(it.cmd)}</code>` : ''}
              </summary>
              ${hasOut ? `<pre class="tool-out${it.bad ? ' bad' : ''}">${esc(it.out.length > 20000 ? it.out.slice(0, 20000) + '\n…' : it.out)}</pre>` : ''}
            </details>
          </li>`;
        }).join('');
        const outcome = p.result ? `<div class="outcome${p.result.bad ? ' bad' : ''}">
            ${p.result.text ? `<div class="outcome-text md">${md(p.result.text)}</div>` : ''}
            <div class="outcome-meta">
              ${p.result.ms ? `<span>Took ${span(p.result.ms)}</span>` : ''}
              ${p.result.cost != null ? `<span>Cost $${Number(p.result.cost).toFixed(2)}</span>` : ''}
              ${p.model ? `<span>${esc(p.model)}</span>` : ''}
            </div>
          </div>` : '';
        return `<section class="phase">
            <div class="phase-head"><h2>${esc(info.title)}</h2><span class="what">${esc(info.what)}</span>${state}</div>
            ${steps ? `<ol class="steps">${steps}</ol>` : ''}
            ${outcome}
          </section>`;
      }).join('');
    }

    async function fetchLogs(first) {
      const id = selectedId;
      const task = tasks.find(t => t.id === id);
      // Finished runs don't change: load once, then stop polling
      if (!first && task && task.status !== 'running' && task.status !== 'queued' && lastLogText) return;
      let text;
      try {
        const res = await api('/task/' + encodeURIComponent(id) + '/logs');
        if (!res.ok) throw new Error(res.status !== 404 ? 'HTTP ' + res.status : task ? 'Its log is no longer available.' : 'This task no longer exists.');
        text = await res.text();
      } catch (e) {
        if (id === selectedId && $('timeline')) $('timeline').innerHTML = `<div class="problem"><p>Couldn't load this run: ${esc(e.message)}</p></div>`;
        return;
      }
      if (id !== selectedId || text === lastLogText) return;
      if (String(window.getSelection() || '').length) return; // don't re-render under an active text selection

      const scroller = $('detail');
      const atBottom = scroller.scrollHeight - scroller.scrollTop <= scroller.clientHeight + 60;
      const open = new Set([...document.querySelectorAll('details.tool[open]')].map(d => d.dataset.id));
      lastLogText = text;
      $('timeline').innerHTML = renderTimeline(parseLog(text), task);
      open.forEach(oid => document.querySelector(`details.tool[data-id="${CSS.escape(oid)}"]`)?.setAttribute('open', ''));
      if (atBottom && !first) scroller.scrollTop = scroller.scrollHeight;
    }

    // ============ Composer ============

    async function submitTask(e) {
      e?.preventDefault();
      const prompt = $('prompt').value.trim();
      const repo = $('repo').value.trim();
      const model = $('model').value;
      store.set('model', model);
      if (!prompt) return $('prompt').focus();
      if (repo && reposEnabled && !repos.some(r => r.full_name === repo)) {
        setHint(`${esc(repo)} isn't one of your Gitea repos. Pick one from the list, or clear the field.`, true);
        return $('repo').focus();
      }
      const btn = $('submit-btn');
      btn.disabled = true;
      btn.title = 'Starting…';
      try {
        const res = await api('/task', { method: 'POST', body: JSON.stringify({ prompt, ...(repo && { repo }), ...(model && { model }) }) });
        const data = await res.json();
        if (!data.id) throw new Error(data.error || 'The runner didn\'t start the task.');
        $('prompt').value = '';
        await fetchTasks();
        selectTask(data.id);
      } catch (err) {
        setHint('Couldn\'t start the task: ' + esc(err.message), true);
      } finally {
        btn.disabled = false;
        btn.title = 'Run task (Ctrl+Enter)';
      }
    }

    $('prompt').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitTask(e);
    });

    function setHint(html, isError = false) {
      $('repo-hint').innerHTML = html;
      $('repo-hint').classList.toggle('error', isError);
    }

    async function fetchRepos(refresh = false) {
      try {
        const data = await (await api('/api/repos' + (refresh ? '?refresh=1' : ''))).json();
        reposEnabled = data.enabled;
        if (!data.enabled) return setHint('Claude picks the repo from your prompt.');
        $('repo-row').hidden = false;
        if (data.error) return setHint('Couldn\'t load your Gitea repos: ' + esc(data.error), true);
        repos = data.repos;
        if (!$('repo').value) $('repo').value = store.get('selected_repo');
        onRepoInput();
        if (repoListOpen) renderRepoList(repoFilter);
      } catch (e) {
        setHint('Couldn\'t load your Gitea repos: ' + esc(e.message), true);
      }
    }

    function onRepoInput() {
      const value = $('repo').value.trim();
      const repo = repos.find(r => r.full_name === value);
      if (repo || !value) store.set('selected_repo', value);
      if (repo) {
        const url = safeUrl(repo.html_url);
        setHint(`Branches from <code>${esc(repo.default_branch)}</code>${url ? `, <a href="${esc(url)}" target="_blank" rel="noopener">view repo</a>` : ''}`);
      } else if (value) {
        const n = repoMatches(value).length;
        setHint(n ? `${n} matching repo${n > 1 ? 's' : ''}. Pick one from the list.` : 'No repo matches.', !n);
      } else {
        setHint(`Claude picks one of your ${repos.length} repos from the prompt.`);
      }
    }

    // Repos matching what's typed (name or description), best first: exact name, then name or
    // owner/name starting with it, then the rest in their original order.
    function repoMatches(filter) {
      const q = filter.trim().toLowerCase();
      if (!q) return repos;
      const rank = r => {
        const full = r.full_name.toLowerCase();
        if (full === q) return 0;
        if (full.startsWith(q) || full.slice(full.indexOf('/') + 1).startsWith(q)) return 1;
        return full.includes(q) ? 2 : 3;
      };
      return repos
        .filter(r => r.full_name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q))
        .map(r => [rank(r), r]).sort((a, b) => a[0] - b[0]).map(([, r]) => r);
    }

    // Escaped text with the first case-insensitive match of q wrapped in <mark>
    function markMatch(text, q) {
      text = String(text ?? '');
      const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    let repoListOpen = false;
    let repoFilter = '';
    let repoShown = []; // options in the open list: a repo, or null for "Any repo"
    let repoActive = -1;

    function renderRepoList(filter) {
      repoFilter = filter.trim();
      repoShown = repoFilter ? repoMatches(repoFilter) : [null, ...repos];
      const current = $('repo').value.trim();
      $('repo-options').innerHTML = repoShown.length ? repoShown.map((r, i) => {
        if (!r) {
          return `<li role="option" id="repo-opt-${i}" data-value="" aria-selected="${!current}">
            <span class="opt-name">Any repo</span><span class="opt-desc">Claude picks from your prompt</span></li>`;
        }
        const tags = [r.private && 'private', r.archived && 'archived'].filter(Boolean);
        return `<li role="option" id="repo-opt-${i}" data-value="${esc(r.full_name)}" aria-selected="${r.full_name === current}">
          <span class="opt-name">${markMatch(r.full_name, repoFilter)}</span>
          <span class="opt-tags">${tags.map(t => `<span class="opt-tag">${t}</span>`).join('')}</span>
          ${r.description ? `<span class="opt-desc">${markMatch(r.description, repoFilter)}</span>` : ''}</li>`;
      }).join('') : '<li class="opt-empty">No repo matches.</li>';
      const picked = repoShown.findIndex(r => (r ? r.full_name : '') === current);
      setRepoActive(picked >= 0 ? picked : repoFilter && repoShown.length ? 0 : -1);
    }

    function setRepoActive(i) {
      repoActive = i;
      const input = $('repo');
      $('repo-options').querySelectorAll('[role="option"]').forEach((el, j) => el.classList.toggle('active', j === i));
      const el = i >= 0 ? $('repo-opt-' + i) : null;
      if (el) {
        input.setAttribute('aria-activedescendant', el.id);
        el.scrollIntoView?.({ block: 'nearest' });
      } else {
        input.removeAttribute('aria-activedescendant');
      }
    }

    // Opening from a click shows every repo when the field already holds a pick; otherwise it filters
    function openRepoList(typed = false) {
      if (!reposEnabled) return;
      const value = $('repo').value.trim();
      renderRepoList(typed || !repos.some(r => r.full_name === value) ? value : '');
      repoListOpen = true;
      $('repo-options').hidden = false;
      $('repo-combo').classList.add('open');
      $('repo').setAttribute('aria-expanded', 'true');
    }

    function closeRepoList() {
      if (!repoListOpen) return;
      repoListOpen = false;
      $('repo-options').hidden = true;
      $('repo-combo').classList.remove('open');
      $('repo').setAttribute('aria-expanded', 'false');
      $('repo').removeAttribute('aria-activedescendant');
    }

    function toggleRepoList() {
      if (repoListOpen) return closeRepoList();
      $('repo').focus();
      openRepoList();
    }

    function pickRepo(value) {
      $('repo').value = value;
      closeRepoList();
      onRepoInput();
    }

    function onRepoTyped() {
      openRepoList(true);
      onRepoInput();
    }

    function onRepoOptionClick(e) {
      const opt = e.target.closest('[role="option"]');
      if (opt) pickRepo(opt.dataset.value);
    }

    function onRepoKey(e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!repoListOpen) return openRepoList();
        const n = repoShown.length;
        if (!n) return;
        const step = e.key === 'ArrowDown' ? 1 : -1;
        setRepoActive(repoActive < 0 ? (step > 0 ? 0 : n - 1) : (repoActive + step + n) % n);
      } else if (e.key === 'Enter' && repoListOpen && repoActive >= 0) {
        e.preventDefault();
        const r = repoShown[repoActive];
        pickRepo(r ? r.full_name : '');
      } else if (e.key === 'Escape' && repoListOpen) {
        e.preventDefault();
        e.stopPropagation(); // don't also close the open task
        closeRepoList();
      }
    }

    // ============ API token ============

    function openSettings() {
      $('new-token').hidden = true;
      fetchTokenStatus();
      settings.showModal();
    }

    async function fetchTokenStatus() {
      try {
        const data = await (await api('/token')).json();
        $('token-status').innerHTML = data.exists
          ? `Active token <code>${esc(data.masked)}</code>`
          : 'No token yet. The API only accepts signed-in browser sessions.';
        $('revoke-btn').hidden = !data.exists;
      } catch (e) {
        $('token-status').textContent = 'Couldn\'t check the token: ' + e.message;
      }
    }

    async function generateToken() {
      if (!confirm('Generate a new token? Anything using the current token will stop working.')) return;
      try {
        const data = await (await api('/token/generate', { method: 'POST' })).json();
        $('new-token-value').textContent = data.token;
        $('new-token').hidden = false;
        $('copy-btn').textContent = 'Copy token';
        $('api-token').value = data.token;
        store.set('api_token', data.token);
        fetchTokenStatus();
      } catch (e) {
        $('token-status').textContent = 'Couldn\'t generate a token: ' + e.message;
      }
    }

    async function revokeToken() {
      if (!confirm('Revoke the token? Anything using it will stop working.')) return;
      try {
        await api('/token', { method: 'DELETE' });
        $('new-token').hidden = true;
        $('api-token').value = '';
        store.set('api_token', '');
        fetchTokenStatus();
      } catch (e) {
        $('token-status').textContent = 'Couldn\'t revoke the token: ' + e.message;
      }
    }

    async function copyToken() {
      try {
        await navigator.clipboard.writeText($('new-token-value').textContent);
        $('copy-btn').textContent = 'Copied';
      } catch {
        $('copy-btn').textContent = 'Select and copy it manually';
      }
    }

    $('api-token').value = store.get('api_token');
    $('api-token').addEventListener('change', e => store.set('api_token', e.target.value));

    // ============ Session ============

    async function fetchCurrentUser() {
      try {
        const data = await (await api('/api/me')).json();
        $('username').textContent = data.username;
      } catch (e) {
        console.error('Failed to load user:', e);
      }
    }

    async function logout() {
      try { await fetch('/api/logout', { method: 'POST' }); } finally { location.href = '/login'; }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && menuTaskId) {
        const id = menuTaskId;
        closeTaskMenu();
        document.querySelector(`.more[data-id="${CSS.escape(id)}"]`)?.focus();
        return;
      }
      if (e.key === 'Escape' && selectedId && !settings.open && document.activeElement?.tagName !== 'TEXTAREA') closeTask();
    });
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (id && id !== selectedId) selectTask(id);
    });

    fetchCurrentUser();
    if ([...$('model').options].some(o => o.value === store.get('model'))) $('model').value = store.get('model');
    fetchRepos();
    fetchTasks().then(() => {
      const id = location.hash.slice(1);
      if (id) selectTask(id);
    });
    setInterval(fetchTasks, 5000);
  </script>
</body>
</html>
