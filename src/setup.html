<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up · Claude Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as dashboard.html */
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --line: #e1e4e9; --ink: #15171c; --muted: #687082;
      --accent: #3b5bdb; --accent-soft: #e8edfd; --fail: #cf3a3a; --fail-soft: #fbe9e9;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f12; --surface: #16181c; --line: #272a31; --ink: #e9eaee; --muted: #8e93a0;
        --accent: #8b9df7; --accent-soft: #1f2540; --fail: #f07a7a; --fail-soft: #331a1c;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 14px/1.5 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
    }
    main { width: min(360px, 100%); }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
    .lede { color: var(--muted); margin: 4px 0 24px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 500; }
    label small { color: var(--muted); font-weight: 400; }
    input {
      height: 36px; padding: 0 10px; font: inherit; color: inherit;
      border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button {
      height: 36px; margin-top: 4px; font: inherit; font-weight: 500; cursor: pointer;
      border: 0; border-radius: 7px; background: var(--ink); color: var(--bg);
    }
    button:hover { opacity: .88; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .error { padding: 10px 12px; border-radius: 7px; background: var(--fail-soft); color: var(--fail); }
  </style>
</head>
<body>
  <main>
    <h1>Set up Claude Runner</h1>
    <p class="lede">Create the admin account. You'll sign in with it to run tasks.</p>

    <form id="setup-form" onsubmit="handleSetup(event)">
      <p class="error" id="error" role="alert" hidden></p>
      <label>Username <small>At least 3 characters</small>
        <input type="text" id="username" name="username" required autocomplete="username" minlength="3" autofocus>
      </label>
      <label>Password <small>At least 8 characters</small>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </label>
      <label>Confirm password
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
      </label>
      <button type="submit" id="submit-btn">Create account</button>
    </form>
  </main>

  <script>
    async function handleSetup(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('submit-btn');
      const error = document.getElementById('error');

      error.hidden = true;

      if (password !== confirmPassword) {
        error.textContent = 'The passwords don\'t match.';
        error.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          error.textContent = data.error || 'Couldn\'t create the account.';
          error.hidden = false;
        }
      } catch (err) {
        error.textContent = 'Couldn\'t reach the runner: ' + err.message;
        error.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }
  </script>
</body>
</html>
